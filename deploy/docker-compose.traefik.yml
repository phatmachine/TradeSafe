# Deploys TradeSafe behind an existing Traefik reverse proxy (e.g. Hostinger's "Ubuntu
# 24.04 with Docker and Traefik" VPS template) instead of the standalone
# Caddy-terminates-its-own-TLS setup in ../docker-compose.yml. Traefik discovers this
# stack via the `traefik.*` labels on `web` and the shared `traefik-proxy` external
# network; nothing here binds a host port. See deploy/README.md, "Deploying behind an
# existing Traefik reverse proxy".
#
# Build contexts point at this repo's GitHub URL rather than `.` so this file also works
# when handed to a platform that writes out the compose file without also checking out
# the rest of the repo alongside it.

services:
  collector:
    build:
      context: https://github.com/phatmachine/TradeSafe.git#main
      dockerfile: deploy/Dockerfile.backend
    command: ["python", "-m", "backend.service.collector"]
    env_file: .env
    volumes:
      - tradesafe_data:/data
    restart: unless-stopped
    networks:
      - internal

  api:
    build:
      context: https://github.com/phatmachine/TradeSafe.git#main
      dockerfile: deploy/Dockerfile.backend
    command: ["uvicorn", "backend.service.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - tradesafe_data:/data
    restart: unless-stopped
    networks:
      - internal

  web:
    build:
      context: https://github.com/phatmachine/TradeSafe.git#main
      dockerfile: deploy/Dockerfile.web.traefik
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.tradesafe.rule=Host(`tradesafe.srv1612559.hstgr.cloud`)
      - traefik.http.routers.tradesafe.entrypoints=websecure
      - traefik.http.routers.tradesafe.tls.certresolver=letsencrypt
      - traefik.http.services.tradesafe.loadbalancer.server.port=80
    networks:
      - traefik-proxy
      - internal

networks:
  traefik-proxy:
    external: true
  internal:
    driver: bridge

volumes:
  tradesafe_data:
