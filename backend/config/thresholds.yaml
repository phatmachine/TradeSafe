# Doctrine thresholds. Every value here is an "open item" from the doctrine appendix
# until it has been run through backend/replay/sweep.py against real history and chosen
# on a stability plateau (see docs/doctrine-summary.md, "Validation posture").
#
# A report computed from this file is always labelled with the sha256 of this file's
# contents (config_hash), so nobody can compare two verdicts produced under different
# thresholds without that being visible.
#
# validated: false means "placeholder, not yet calibrated" — the report will say so.

meta:
  validated: false
  notes: >
    Initial values are conservative starting points taken from worked examples in the
    doctrine (ZEC log) and standard TA/quant conventions. Run the calibration sweep
    before trusting a report for anything beyond exercising the pipeline.

# 0.1 / Layer 1 — provenance & independence
min_independent: 2          # distinct upstream_id sources required per decision metric

# 0.2 — half-life expiry, in seconds
expiry:
  price_seconds: 30
  order_book_seconds: 15
  oi_funding_normal_seconds: 3600      # 1 hour
  oi_funding_fast_tape_seconds: 900    # 15 minutes, when fast_tape_rv_threshold is hit
  liquidation_seconds: 14400           # 4 hours
  etf_flow_seconds: 86400              # 1 day
  supply_float_seconds: 604800         # 1 week
  event_calendar_seconds: 604800

# 0.2 — fast-tape switch: realised vol (rv_short, annualised) above this flips OI/funding
# expiry from the 1-hour default to the 15-minute one.
fast_tape_rv_threshold: 1.0   # 100% annualised realised vol

# 0.4 / 0.8 — cross-venue dispersion tolerance, per metric. Each entry picks a mode:
#   relative: (max - min) / |median|  — for a metric where every venue reports the same
#             underlying fact, so divergence is genuinely a corruption signal
#   absolute: (max - min) in the metric's own units — for a signed metric that sits near
#             zero, where a median denominator is meaningless
# Above the ceiling the metric is flagged and, for decision-path metrics, the run fails
# closed. CALIBRATED 2026-09-18 from measurement; see each note.
max_dispersion:
  # A single shared fact — every venue is pricing the same asset, so tight agreement is
  # required and divergence is real corruption. Observed ~0.0005-0.005 across 6 venues,
  # so 0.02 was already sound and is unchanged.
  price:
    relative: 0.02

  # Signed and near zero, so the old relative form was unusable: venue rates of
  # -0.035 / +0.003 / -0.002 / -0.028 gave a median of -0.0022 and a "dispersion" of
  # 16.97 against a 0.5 ceiling, while the venues in fact agreed to within 0.04
  # percentage points. Measured absolute spread per 8h across venues: BTC max 0.0066,
  # ETH max 0.0140, SOL max 0.0206, ZEC max 0.0451. 0.5 leaves ~11x headroom over the
  # worst observed while still catching a venue reporting an order-of-magnitude wrong
  # rate.
  funding_8h:
    absolute: 0.5

  # Venue open interest legitimately differs by venue size — Binance 552k vs OKX 146k on
  # ZEC is market structure, not disagreement about a fact — so the old 0.15 ceiling was
  # unreachable (measured dispersion never fell below 0.20 on any instrument). Kept as a
  # relative check purely to catch a units error, which shows up around 20x+; measured
  # range was 0.20-2.20, so 5.0 tolerates real venue spread with room while still
  # failing on nonsense. Measured over hours of live collection, not 30 days — worth
  # re-checking once more history has accumulated.
  oi_coin:
    relative: 5.0

# 0.5 — synthetic-content / coherence tolerance for a single source's internally
# derived fields (e.g. its own OI-in-USD vs OI-in-coins * its own price)
coherence_tol: 0.03

# Never compute a ratio from observations more than this far apart in observed_at.
sync_tolerance_seconds: 120

# realised volatility windows, in days, for the annualised stdev-of-log-returns calc
rv_short_days: 7
rv_long_days: 30

# 2.1 — regime classification
trend_window_days: 21
trend_ratio_max: 0.7     # rv_short / rv_long must be below this for "trending"
n_swings_required: 3
swing_lookback_bars: 5
swing_timeframe: "4h"
hl_margin_pct: 0.01      # a swing low must exceed the prior swing low by at least this

# 2.2 — trapped cohort
liq_window_hours: 72
liq_min_consistent_periods: 3

# 2.3 / cost model — carry materiality
atr_n: 14
carry_ratio_material: 0.15     # carry / expected-move ATR fraction considered "material"
carry_ratio_decline: 0.33      # above this, decline the trade regardless of setup quality
expected_hold_days_default: 10

# Layer 3 setup parameters
cascade:
  flush_oi_pct: 0.12          # required coin-OI drop from its window peak
  flush_window_hours: 48
  flush_hold_periods: 3       # consecutive polling periods the decline must hold
  flush_range_pct: 0.03       # price range contraction threshold (of price) post-flush
  stab_periods: 3             # consecutive closes required above the flush-wick low
  spent_band_pct: 0.05        # "premise spent": coin OI back within this band of pre-flush level
  # "Liquidation print settled" = the last liquidation_quiet_minutes of liquidations are
  # back to the coin's usual level: at most liquidation_settled_multiple x the median hour
  # over the previous liquidation_baseline_days, on the same exchanges (setups/cascade.py).
  # REDEFINED 2026-09-19 from "no prints at all for 60 minutes", which measured coverage
  # more than the market. Hours with no liquidation on any of Binance/Bybit/OKX, ~3.5
  # months of Coinalyze hourly data: BTC 2.7%, ETH 2.3%, SOL 10.1%, ZEC 4.6% (OKX alone:
  # 16-24%); over the last day the old rule held 0% on all four with all three exchanges.
  # Baseline length, same data, rule "last hour <= 1.0x median hour": 3 and 7 days behave
  # alike on every coin (~50% of hours pass; median 3h from a >=5x spike back to a pass;
  # ~33-42% pass in the 6h after a spike). At 14 and 30 days ZEC, whose activity rose
  # sharply, failed to pass within 72h of 18 and 24 spikes: a long baseline goes stale.
  # 7 days sits on the plateau. 1.0x is the plain reading of "usual" (the median hour),
  # not fitted to outcomes: the multiple is the value to sweep once the research harness
  # has liquidation history.
  liquidation_quiet_minutes: 60
  liquidation_baseline_days: 7
  liquidation_settled_multiple: 1.0
  bar_seconds: 900             # bar size used for OI-series / flush-bar detection (15 min)

# Layer 0 measurement rule: OI-weighted funding at or below zero for this many
# consecutive polling periods counts as "funding reset/normalised".
funding_periods: 3

exhaustion:
  # uses carry_ratio_material, plus:
  structural_break_lookback_bars: 20

# Fractions of the last swing leg (swing low -> high since it in an uptrend, mirrored in
# a downtrend), NOT of price — see setups/continuation.py. The band itself is the
# doctrine's own 15-25% and is unchanged; what changed 2026-09-18 is what it is measured
# against. The old reading (drop from the high of the last 20 x 15-minute closes) was
# structurally unreachable: over 365 days of 4h bars a confirmed uptrend coincided with a
# 15-25% drop on that basis 0 times on BTC, ETH, SOL and ZEC (BTC's largest 5-hour drop
# all year: 8.6%). The band is still an uncalibrated placeholder as a leg fraction.
continuation:
  retrace_min_pct: 0.15
  retrace_max_pct: 0.25

# Gate U ceilings — see backend/config/universe.yaml for the per-check definitions;
# duplicated key names here so calibration sweep can vary them in one place.
gate_u:
  # CALIBRATED 2026-09-18 from measurement, unlike its neighbours here. The previous
  # placeholder of 3.0 had a 0% pass rate: measured daily perp/spot base-volume ratios
  # over the preceding 30 days never once fell below it —
  #   BTC  min 5.05  median  9.83  max 12.10
  #   ETH  min 8.70  median 12.06  max 13.78
  #   SOL  min 5.37  median  7.86  max  9.52
  #   ZEC  min 4.35  median  7.66  max  9.76
  # 3.0 therefore rejected every liquid instrument including the deepest spot market in
  # the asset class, which is not what "price discovery must not sit entirely in
  # derivatives" is meant to catch. 20.0 sits ~45% above the highest observed value, so
  # a healthy major passes even on an unusual day, while genuinely perp-dominated
  # tokens (30x+) still fail. Re-measure if the venue set in sources/ changes, since
  # adding spot venues lowers the ratio by raising the denominator.
  perp_spot_ratio_ceiling: 20.0
  oi_to_mcap_ceiling: 0.15
  min_spot_depth_multiple: 20   # resting liquidity at entry zone must be >= N x intended size
  rv_band_min: 0.20
  rv_band_max: 3.0
  order_book_band_pct: 0.01     # +/- 1% of mid price counts as "the entry zone"
  reference_intended_size_coins: 1.0   # placeholder notional the depth check sizes against;
                                        # replace with your real intended trade size

# Directional factors (report/factors.py) — the "for or against a long" read shown next
# to the setups. PRESENTATION ONLY: none of these feed a verdict, verdict_bias or setup,
# so they can't make a report pass or fail. Uncalibrated placeholders like the rest of
# this file, except funding_neutral_max_pct, which is a venue convention rather than a
# choice: Binance, Bybit and OKX all default to 0.01% per 8h (the interest component)
# when longs and shorts are balanced, so only funding above it means longs are paying up.
directional_factors:
  funding_neutral_max_pct: 0.01   # percent per 8h, same units as FUNDING_8H observations
  window_hours: 24                # OI-vs-price and the perp/spot price move look back this far
  min_move_pct: 0.01              # OI or price moves smaller than 1% read as flat
  perp_spot_baseline_days: 7      # "this coin's usual mix" = median hourly perp/spot ratio over this
  perp_spot_min_baseline_hours: 48  # fewer hours of history than this -> unknown, not a guess
  perp_spot_band_pct: 0.2         # more than 20% above/below the usual mix = perp-/spot-heavy

# Exit-monitoring windows, per setup, in days — the time-stop keys off this.
expected_hold_window_days:
  cascade_absorption: 10
  squeeze_absorption: 10                       # mirror of cascade_absorption
  positioning_exhaustion: 14
  event_decompression: 5
  trend_continuation_leverage_reset: 14
  downtrend_continuation_leverage_reset: 14    # mirror of trend_continuation_leverage_reset
